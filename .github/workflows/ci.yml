name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run check:dead-code
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder

  e2e:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select e2e sections for the PR's changed files
        id: plan
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          npm run -s test:e2e:plan -- --files $(cat changed.txt) | tee plan.txt
          grep -q "Selected smoke sections: none" plan.txt && echo "skip=true" >> "$GITHUB_OUTPUT" || true
      - name: Start local Supabase (migrations + seed)
        if: steps.plan.outputs.skip != 'true'
        run: |
          npx supabase start -x studio,logflare,vector,edge-runtime
          npm run -s wt -- env >> "$GITHUB_ENV"
      - name: Start the app
        if: steps.plan.outputs.skip != 'true'
        run: |
          npx playwright install --with-deps chromium
          npx next dev -p 3000 > next.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://localhost:3000/auth/login > /dev/null && break; sleep 2; done
      - name: Run selected e2e sections
        if: steps.plan.outputs.skip != 'true'
        run: npm run -s test:e2e:plan -- --files $(cat changed.txt) --run
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            next.log
          retention-days: 7
